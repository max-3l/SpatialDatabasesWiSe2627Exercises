  <circle cx="290" cy="340" r="4.5" fill="#16a34a"/>
  <circle cx="440" cy="340" r="4.5" fill="#16a34a"/>

  <!-- LineString E -->
  <line x1="190" y1="440" x2="190" y2="240" stroke="#dc2626" stroke-width="3"/>
  <circle cx="190" cy="440" r="4.5" fill="#dc2626"/>
  <circle cx="190" cy="240" r="4.5" fill="#dc2626"/>

